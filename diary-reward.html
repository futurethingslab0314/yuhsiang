<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, initial-scale=1.0">
    <title>每日日記獎勵系統 - Raspberry Pi</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="diary-reward-style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="container">
        <!-- 頂部標題欄 -->
        <header class="header">
            <h1 class="main-title">每日日記獎勵系統</h1>
            <div class="date-display" id="dateDisplay"></div>
        </header>

        <!-- 主要內容區 -->
        <main class="main-content">
            <!-- 左側：輸入區域 -->
            <section class="input-section">
                <div class="input-card">
                    <h2 class="section-title">今日日記</h2>
                    
                    <!-- 輸入模式切換 -->
                    <div class="input-mode-toggle">
                        <button class="mode-btn active" data-mode="text" id="textModeBtn">
                            📝 文字輸入
                        </button>
                        <button class="mode-btn" data-mode="voice" id="voiceModeBtn">
                            🎤 語音輸入
                        </button>
                    </div>

                    <!-- 文字輸入區 -->
                    <div class="text-input-area" id="textInputArea">
                        <textarea 
                            id="diaryInput" 
                            class="diary-textarea" 
                            placeholder="寫下你今天的心情、想法或經歷...&#10;&#10;範例：&#10;今天天氣很好，和朋友去了公園散步。看到很多小孩在玩耍，心情變得很愉快。晚上做了一頓美味的晚餐，感覺很滿足。"
                            maxlength="500"></textarea>
                        <div class="char-counter">
                            <span id="charCount">0</span> / 500
                        </div>
                    </div>

                    <!-- 語音輸入區 -->
                    <div class="voice-input-area hidden" id="voiceInputArea">
                        <button class="voice-record-btn" id="voiceRecordBtn">
                            <span class="voice-icon">🎤</span>
                            <span class="voice-text">點擊開始錄音</span>
                        </button>
                        <div class="recording-indicator hidden" id="recordingIndicator">
                            <span class="pulse-dot"></span>
                            <span>錄音中...</span>
                        </div>
                        <div class="voice-transcript" id="voiceTranscript"></div>
                    </div>

                    <!-- 提交按鈕 -->
                    <button class="submit-btn" id="submitBtn">
                        <span class="btn-icon">✨</span>
                        提交日記
                    </button>

                    <!-- 分析狀態 -->
                    <div class="analysis-status hidden" id="analysisStatus">
                        <div class="loading-spinner"></div>
                        <p>AI 正在分析你的日記...</p>
                    </div>
                </div>
            </section>

            <!-- 右側：獎勵顯示區 -->
            <section class="reward-section">
                <!-- 累積獎勵顯示 -->
                <div class="reward-card">
                    <h2 class="section-title">獎勵累積</h2>
                    <div class="total-rewards">
                        <div class="coin-icon-large">🪙</div>
                        <div class="reward-amount" id="totalRewards">0</div>
                        <div class="reward-label">累積硬幣</div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-text">
                        <span id="currentProgress">0</span> / <span id="targetProgress">100</span>
                        <span class="progress-label">目標達成</span>
                    </div>
                </div>

                <!-- 今日獎勵顯示 -->
                <div class="today-reward-card">
                    <h3 class="card-subtitle">今日獲得</h3>
                    <div class="today-reward-amount" id="todayReward">+0</div>
                    <div class="reward-description" id="rewardDescription">
                        提交日記後即可獲得獎勵
                    </div>
                </div>

                <!-- 列印提示卡片 -->
                <div class="print-card hidden" id="printCard">
                    <div class="print-icon">🎟️</div>
                    <h3 class="print-title">紙籤已準備好！</h3>
                    <p class="print-message">恭喜達成目標！點擊下方按鈕開始列印你的專屬紙籤</p>
                    <button class="print-btn" id="printBtn">
                        🖨️ 開始列印
                    </button>
                </div>
            </section>
        </main>

        <!-- 硬幣動畫容器 -->
        <div class="coins-container" id="coinsContainer"></div>

        <!-- 模擬投幣按鈕（模擬紅外線感應） -->
        <button class="hidden-trigger-btn" id="triggerCoinBtn" title="模擬投幣動作（開發測試用）">
            💰 測試投幣
        </button>
    </div>

    <!-- 成功提示彈窗 -->
    <div class="modal hidden" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">日記提交成功！</h2>
            <p class="modal-message" id="modalMessage">
                你獲得了 <strong id="modalReward">0</strong> 枚硬幣！
            </p>
            <button class="modal-btn" id="closeModalBtn">太棒了！</button>
        </div>
    </div>

    <!-- 列印預覽彈窗 -->
    <div class="modal hidden" id="printModal">
        <div class="modal-content print-preview">
            <h2 class="modal-title">紙籤預覽</h2>
            <div class="ticket-preview" id="ticketPreview">
                <div class="ticket-header">✨ 專屬任務紙籤 ✨</div>
                <div class="ticket-content" id="ticketContent">
                    載入中...
                </div>
                <div class="ticket-footer">Keep Going! 🌟</div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancelPrintBtn">取消</button>
                <button class="modal-btn primary" id="confirmPrintBtn">確認列印</button>
            </div>
        </div>
    </div>

    <script src="diary-reward-script.js"></script>
</body>
</html>
