<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, initial-scale=1.0">
    <title>每日日記獎勵系統 - Raspberry Pi</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="diary-reward-style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="container">
        <!-- 極簡主畫面：只顯示錢幣堆疊 -->
        <div class="coin-stack-view">
            <!-- 背景模糊效果層 -->
            <div class="blur-background"></div>
            
            <!-- 地板線 -->
            <div class="ground-line"></div>
            
            <!-- 錢幣堆疊容器 -->
            <div class="coin-stack-container" id="coinStackContainer">
                <!-- 錢幣會動態生成在這裡 -->
            </div>
            
            <!-- 移除數字顯示，改為純粹的硬幣堆疊視覺 -->
            
            <!-- 今日獲得提示（淡入淡出） -->
            <div class="today-gain-toast hidden" id="todayGainToast">
                <span class="toast-text">今日 +<span id="toastAmount">0</span></span>
            </div>
        </div>

        <!-- 設定按鈕（浮動） -->
        <button class="floating-settings-btn" id="settingsBtn" title="開啟設定">
            ⚙️
        </button>

        <!-- 設定面板（側邊滑出） -->
        <div class="settings-panel hidden" id="settingsPanel">
            <div class="settings-header">
                <h2 class="settings-title">設定與輸入</h2>
                <button class="close-settings-btn" id="closeSettingsBtn">✕</button>
            </div>
            
            <div class="settings-content">
                <!-- 日期顯示 -->
                <div class="settings-section">
                    <div class="date-display" id="dateDisplay"></div>
                </div>

                <!-- 輸入模式切換 -->
                <div class="settings-section">
                    <h3 class="section-subtitle">輸入模式</h3>
                    <div class="input-mode-toggle">
                        <button class="mode-btn active" data-mode="text" id="textModeBtn">
                            📝 文字
                        </button>
                        <button class="mode-btn" data-mode="voice" id="voiceModeBtn">
                            🎤 語音
                        </button>
                    </div>
                </div>

                <!-- 文字輸入區 -->
                <div class="settings-section text-input-area" id="textInputArea">
                    <h3 class="section-subtitle">今日日記</h3>
                    <textarea 
                        id="diaryInput" 
                        class="diary-textarea" 
                        placeholder="寫下你今天的心情..."
                        maxlength="500"></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span> / 500
                    </div>
                </div>

                <!-- 語音輸入區 -->
                <div class="settings-section voice-input-area hidden" id="voiceInputArea">
                    <h3 class="section-subtitle">語音錄製</h3>
                    <button class="voice-record-btn compact" id="voiceRecordBtn">
                        <span class="voice-icon">🎤</span>
                        <span class="voice-text">開始錄音</span>
                    </button>
                    <div class="recording-indicator hidden" id="recordingIndicator">
                        <span class="pulse-dot"></span>
                        <span>錄音中...</span>
                    </div>
                    <div class="voice-transcript" id="voiceTranscript"></div>
                </div>

                <!-- 提交按鈕 -->
                <div class="settings-section">
                    <button class="submit-btn" id="submitBtn">
                        <span class="btn-icon">✨</span>
                        提交日記
                    </button>
                </div>

                <!-- 分析狀態 -->
                <div class="analysis-status hidden" id="analysisStatus">
                    <div class="loading-spinner"></div>
                    <p>AI 正在分析...</p>
                </div>

                <!-- 進度資訊 -->
                <div class="settings-section">
                    <h3 class="section-subtitle">進度追蹤</h3>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-text">
                        <span id="currentProgress">0</span> / <span id="targetProgress">100</span>
                        <span class="progress-label">目標達成</span>
                    </div>
                    <div class="today-reward-info">
                        <span>今日獲得: </span>
                        <span class="today-reward-amount" id="todayReward">+0</span>
                    </div>
                </div>

                <!-- 列印提示 -->
                <div class="settings-section print-card hidden" id="printCard">
                    <div class="print-compact">
                        <div class="print-icon">🎟️</div>
                        <div class="print-info">
                            <h4 class="print-title">紙籤已準備好！</h4>
                            <p class="print-message">恭喜達成目標</p>
                        </div>
                        <button class="print-btn" id="printBtn">列印</button>
                    </div>
                </div>

                <!-- 測試功能 -->
                <div class="settings-section">
                    <h3 class="section-subtitle">測試功能</h3>
                    <div class="test-buttons">
                        <button class="test-btn" id="triggerCoinBtn">💰 投幣動畫</button>
                        <button class="test-btn" onclick="testFillData()">📝 填充測試</button>
                        <button class="test-btn" onclick="testShowPrint()">🎟️ 達標測試</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 硬幣掉落動畫容器 -->
        <div class="coins-container" id="coinsContainer"></div>
    </div>

    <!-- 成功提示彈窗 -->
    <div class="modal hidden" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">日記提交成功！</h2>
            <p class="modal-message" id="modalMessage">
                你獲得了 <strong id="modalReward">0</strong> 枚硬幣！
            </p>
            <button class="modal-btn" id="closeModalBtn">太棒了！</button>
        </div>
    </div>

    <!-- 列印預覽彈窗 -->
    <div class="modal hidden" id="printModal">
        <div class="modal-content print-preview">
            <h2 class="modal-title">紙籤預覽</h2>
            <div class="ticket-preview" id="ticketPreview">
                <div class="ticket-header">✨ 專屬任務紙籤 ✨</div>
                <div class="ticket-content" id="ticketContent">
                    載入中...
                </div>
                <div class="ticket-footer">Keep Going! 🌟</div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancelPrintBtn">取消</button>
                <button class="modal-btn primary" id="confirmPrintBtn">確認列印</button>
            </div>
        </div>
    </div>

    <script src="diary-reward-script.js"></script>
</body>
</html>
