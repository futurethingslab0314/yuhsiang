<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素風格硬幣堆疊系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, system-ui, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            width: 1080px;
            height: 1920px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 1080/1920;
        }

        .coin-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            object-fit: contain;
        }

        /* =========================================
           核心動畫定義
           ========================================= */
        @keyframes breathe-text {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-mic {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes ripple-wave {
            0% { transform: scale(1); opacity: 0.6; border-width: 4px; }
            100% { transform: scale(3); opacity: 0; border-width: 0px; }
        }

        @keyframes print-wave {
            0% { height: 10%; opacity: 0.3; }
            50% { height: 100%; opacity: 0.8; }
            100% { height: 10%; opacity: 0.3; }
        }

        /* =========================================
           引導語顯示區域 (Prompt Screen)
           ========================================= */
        .guide-message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            /* 背景：暖黃色，保持平靜感與留白感 */
            background-color: #FFB800; 
            color: #000000; /* 黑字 */
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
            z-index: 50;
        }

        .guide-message.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 引導語文字：呼吸感、清晰易讀 */
        .guide-message .guide-text {
            margin-bottom: 120px; /* 大量留白 */
            color: #000000; /* 黑字 */
            /* 修正：使用清晰易讀的內文字體，非像素字 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 32px;
            line-height: 1.8;
            font-weight: 400;
            letter-spacing: 0.05em;
            max-width: 800px;
            
            /* 呼吸動畫：緩慢淡入 */
            opacity: 0; /* 初始隱藏 */
            animation: breathe-text 4s ease-out forwards;
            animation-delay: 0.5s;
        }

        .guide-message .guide-hint {
            /* 隱藏舊的提示文字，由麥克風圖示取代 */
            display: none;
        }

        /* =========================================
           麥克風與錄音互動區
           ========================================= */
        .mic-container {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            cursor: pointer;
            z-index: 60;
        }

        /* 麥克風圖示 (像素風格 SVG) */
        .pixel-mic-icon {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            fill: #000000; /* 黑字 */
            transition: all 0.3s ease;
        }

        /* 預備狀態：呼吸閃爍 */
        .mic-container.idle .pixel-mic-icon {
            animation: pulse-mic 3s infinite ease-in-out;
            opacity: 0.7;
        }

        /* 錄音狀態：聲波動畫容器 */
        .mic-ripples {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }

        .mic-container.recording .mic-ripples {
            display: block;
        }

        /* 動態生成的波紋圈 */
        .ripple-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 184, 0, 0.4); /* 柔和暖黃 */
            border-radius: 50%;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            /* 動畫由 JS 動態控制強度，或使用 CSS 預設 */
            transition: width 0.1s, height 0.1s, opacity 0.1s;
        }


        /* =========================================
           列印提示區域 (Print Notification)
           ========================================= */
        .print-notification {
            position: absolute;
            inset: 0; /* 滿版覆蓋 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 27, 25, 0.95); /* 深色背景 */
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* 慢速優雅過場 */
            pointer-events: none;
            z-index: 100;
        }

        .print-notification.show {
            opacity: 1;
            pointer-events: auto;
        }

        .print-icon-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .print-icon {
            font-size: 64px;
            z-index: 2;
        }

        /* 模擬打印機聲音波形 */
        .print-sound-waves {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            height: 40px;
            align-items: flex-end;
        }

        .sound-bar {
            width: 6px;
            background-color: #FFB800;
            border-radius: 3px;
            animation: print-wave 0.8s infinite ease-in-out;
        }

        .print-notification .print-title {
            font-size: 28px;
            font-weight: 400;
            color: #e6e0d5;
            margin-bottom: 16px;
            font-family: -apple-system, sans-serif;
            letter-spacing: 2px;
        }

        .print-notification .print-message {
            font-size: 16px;
            color: #888;
            font-family: -apple-system, sans-serif;
            line-height: 1.6;
        }

        /* 隱藏舊元素 */
        .voice-indicator, .voice-dots, .voice-dot {
            display: none;
        }

        /* 狀態指示器（測試用） */
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            z-index: 100;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        /* 退出全螢幕按鈕 */
        .exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        .exit-fullscreen-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .exit-fullscreen-btn:active {
            transform: scale(0.95);
        }

        /* 全螢幕時顯示退出按鈕 */
        :fullscreen .exit-fullscreen-btn,
        :-webkit-full-screen .exit-fullscreen-btn,
        :-moz-full-screen .exit-fullscreen-btn,
        :-ms-fullscreen .exit-fullscreen-btn {
            display: flex;
        }

        /* 進入全螢幕提示 */
        .fullscreen-prompt {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: #ffffff;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
        }

        .fullscreen-prompt.hidden {
            display: none;
        }

        .fullscreen-prompt-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 0;
        }

        .fullscreen-prompt-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15vh;
        }

        .fullscreen-prompt-title h2 {
            font-size: clamp(48px, 8vw, 120px);
            font-weight: bold;
            color: #FFB800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: clamp(2px, 0.5vw, 8px);
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
        }

        .fullscreen-prompt-btn {
            width: clamp(80px, 12vw, 150px);
            height: clamp(80px, 12vw, 150px);
            border-radius: 50%;
            background-color: #FFB800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-bottom: 12vh;
            padding: 0;
            flex-shrink: 0;
        }

        .fullscreen-prompt-btn:hover {
            background-color: #ffffff;
            transform: scale(1.1);
        }

        .fullscreen-prompt-btn:active {
            transform: scale(0.95);
        }

        .fullscreen-prompt-btn::after {
            content: '';
            width: 0;
            height: 0;
            border-left: clamp(20px, 3vw, 40px) solid #000000;
            border-top: clamp(14px, 2vw, 28px) solid transparent;
            border-bottom: clamp(14px, 2vw, 28px) solid transparent;
            margin-left: clamp(4px, 0.5vw, 8px);
        }

        .fullscreen-prompt-subtitle {
            color: #ffffff;
            font-size: clamp(16px, 2.5vw, 32px);
            text-align: center;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            letter-spacing: clamp(0.5px, 0.1vw, 2px);
            position: absolute;
            bottom: 10vh;
        }

        @media (max-width: 1080px) {
            .canvas-container {
                width: 100vw;
                height: 100vh;
            }
            
            .voice-indicator {
                top: 40px;
                right: 40px;
            }
            
            .voice-dot {
                width: 10px;
                height: 10px;
            }

            .guide-message {
                font-size: 24px;
                padding: 40px 24px;
                font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
                font-weight: bold;
                letter-spacing: 1px;
            }

            .print-notification {
                padding: 40px 30px;
            }

            .print-notification .print-icon {
                font-size: 60px;
            }

            .print-notification .print-title {
                font-size: 28px;
            }

            .print-notification .print-message {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="coinCanvas" class="coin-canvas"></canvas>
            
            <!-- 引導語顯示 -->
            <div class="guide-message" id="guideMessage">
                <div class="guide-text" id="guideText"></div>
                
                <!-- 新的麥克風互動區 -->
                <div class="mic-container idle" id="micContainer">
                    <div class="mic-ripples" id="micRipples">
                        <!-- 波紋圓圈將由 JS 動態產生 -->
                    </div>
                    <!-- 像素麥克風 SVG -->
                    <svg class="pixel-mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>

            </div>

            <!-- 列印提示 -->
            <div class="print-notification" id="printNotification">
                <div class="print-icon-container">
                    <div class="print-icon">📄</div>
                    <!-- 模擬列印聲波 -->
                    <div class="print-sound-waves">
                        <div class="sound-bar" style="animation-delay: 0s; height: 20px;"></div>
                        <div class="sound-bar" style="animation-delay: 0.2s; height: 30px;"></div>
                        <div class="sound-bar" style="animation-delay: 0.4s; height: 15px;"></div>
                        <div class="sound-bar" style="animation-delay: 0.1s; height: 25px;"></div>
                        <div class="sound-bar" style="animation-delay: 0.3s; height: 10px;"></div>
                    </div>
                </div>
                <div class="print-title">列印中</div>
                <div class="print-message" id="printMessage">
                    正在將你的話語<br>化為實體...
                </div>
            </div>

            <!-- 除錯資訊 -->
            <div class="debug-info" id="debugInfo">
                <div>狀態: <span id="debugState">待機</span></div>
                <div>金幣數: <span id="debugCoins">0</span></div>
                <div>目標: <span id="debugTarget">30</span></div>
                <div>錄音: <span id="debugRecording">否</span></div>
            </div>
        </div>

        <!-- 退出全螢幕按鈕 -->
        <button class="exit-fullscreen-btn" id="exitFullscreenBtn" title="退出全螢幕 (ESC)">✕</button>

        <!-- 進入全螢幕提示 -->
        <div class="fullscreen-prompt" id="fullscreenPrompt">
            <div class="fullscreen-prompt-content">
                <div class="fullscreen-prompt-title">
                    <h2>DIARY</h2>
                    <h2>SYSTEM</h2>
                </div>
                <button class="fullscreen-prompt-btn" id="enterFullscreenBtn" title="進入全螢幕"></button>
            </div>
            <div class="fullscreen-prompt-subtitle">收集生活中的小小碎片</div>
        </div>
    </div>

    <script>
        // ====================================
        // API 基礎路徑設定
        // ====================================
        // 自動判斷環境：
        // - file:// 協議 → 使用線上 Vercel API
        // - localhost → 使用本地 API
        // - 線上環境 → 使用相對路徑（同域名）
        let API_BASE_URL = '';
        if (window.location.protocol === 'file:') {
            // 如果是 file:// 打開，使用線上 API
            API_BASE_URL = 'https://yuhsiang.vercel.app';
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            // 本地開發環境
            API_BASE_URL = 'http://localhost:3000';
        } else {
            // 線上環境使用相對路徑（同域名）
            API_BASE_URL = '';
        }

        // ====================================
        // 硬幣類別
        // ====================================
        class Coin {
            constructor(x, y, velocityY, size) {
                this.x = x;
                this.y = y;
                this.velocityY = velocityY;
                this.size = size;
                this.settled = false;
            }
        }

        // ====================================
        // 全域變數
        // ====================================
        let canvas;
        let ctx;
        let animationId;
        let coins = [];

        // 設定參數
        const COIN_SIZE = 32;
        const GRAVITY = 0.8;
        const GROUND_Y = 1920 - 100;
        const LEFT_MARGIN = 100;
        const RIGHT_MARGIN = 1080 - 100;

        // ====================================
        // 系統狀態管理
        // ====================================
        const SystemState = {
            IDLE: 'idle',                    // 待機（顯示引導語）
            RECORDING: 'recording',          // 錄音中
            PROCESSING: 'processing',        // 處理中
            REWARD: 'reward',                // 獎勵動畫
            PRINT_READY: 'print_ready'       // 準備列印
        };

        const AppState = {
            currentState: SystemState.IDLE,
            totalCoins: 0,
            coinThreshold: 30,              // 列印門檻
            isRecording: false,
            currentGuideText: '',
            debugMode: false,
            // 引導語排程（預設 22:00 顯示一次）
            guideEnabled: true,
            guideHour: 22,
            guideMinute: 0,
            lastGuideShownDate: null
        };

        // UI 元素
        let guideMessageEl, guideTextEl;
        let printNotificationEl, printMessageEl;
        let debugInfoEl, debugStateEl, debugCoinsEl, debugRecordingEl;
        let micContainerEl, micRipplesEl; // 新增 UI 元素
        
        // 音訊分析相關
        let audioContext;
        let analyser;
        let dataArray;
        let rippleInterval;

        // ====================================
        // 初始化
        // ====================================
        document.addEventListener('DOMContentLoaded', function() {
            // Canvas 初始化
            canvas = document.getElementById('coinCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1920;
            ctx.imageSmoothingEnabled = false;
            
            // UI 元素初始化
            guideMessageEl = document.getElementById('guideMessage');
            guideTextEl = document.getElementById('guideText');
            printNotificationEl = document.getElementById('printNotification');
            printMessageEl = document.getElementById('printMessage');
            debugInfoEl = document.getElementById('debugInfo');
            debugStateEl = document.getElementById('debugState');
            debugCoinsEl = document.getElementById('debugCoins');
            debugRecordingEl = document.getElementById('debugRecording');
            
            // 新增的 UI 元素
            micContainerEl = document.getElementById('micContainer');
            micRipplesEl = document.getElementById('micRipples');
            
            // 設定麥克風互動
            setupMicInteraction();
            
            // 開始動畫
            startAnimation();
            
            // 初始化系統狀態
            initializeSystem();
            
            // 設定 Console 測試指令
            setupConsoleCommands();
            
            // 設定全螢幕功能
            setupFullscreen();
            
            console.log('🎮 系統已啟動！輸入 help() 查看測試指令');
        });
        
        // 設定麥克風互動邏輯
        function setupMicInteraction() {
            // 點擊麥克風開始錄音
            micContainerEl.addEventListener('click', function() {
                if (AppState.currentState === SystemState.IDLE && !AppState.isRecording) {
                    handleRecordingStart();
                }
            });
            
            // 注意：錄音結束由實體按鈕控制，會直接呼叫 handleRecordingEnd()
        }

        // 開始動畫循環
        function startAnimation() {
            if (typeof window.__printedRoundFlag === 'undefined') {
                window.__printedRoundFlag = false;
            }
            function animate() {
                // 清除畫布
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 繪製地面線
                ctx.fillStyle = '#333333';
                ctx.fillRect(LEFT_MARGIN, GROUND_Y, RIGHT_MARGIN - LEFT_MARGIN, 2);
                
                // （已移除）背景直條格線
                
                // 更新和繪製硬幣
                coins.forEach((coin) => {
                    if (!coin.settled) {
                        // 應用重力
                        coin.velocityY += GRAVITY;
                        coin.y += coin.velocityY;
                        
                        // 檢查是否應該落腳
                        const settlePos = findSettlePosition(coin.x, coin.y);
                        
                        if (settlePos && coin.y >= settlePos.y - COIN_SIZE / 2) {
                            coin.x = settlePos.x;
                            coin.y = settlePos.y;
                            coin.settled = true;
                            coin.velocityY = 0;
                        }
                    }
                    
                    // 繪製硬幣
                    ctx.fillStyle = '#FFB800';
                    ctx.fillRect(Math.floor(coin.x), Math.floor(coin.y), coin.size, coin.size);
                });
                
                // 計算目前堆疊最高點
                const highestTopY = getHighestStackTopY();
                
                // 使用固定高度觸發列印（約畫面的 20% 位置，即從頂部往下 20%）
                const triggerY = canvas.height * 0.2; // 固定觸發高度
                
                // 當堆疊高度達到或超過觸發位置，觸發列印（僅一次）
                if (!window.__printedRoundFlag && highestTopY !== null && highestTopY <= triggerY) {
                    window.__printedRoundFlag = true;
                    triggerPrintNotification();
                }
                
                animationId = requestAnimationFrame(animate);
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // 檢查位置是否被佔用
        function isPositionOccupied(x, y) {
            for (const coin of coins) {
                if (coin.settled) {
                    if (Math.abs(coin.x - x) < COIN_SIZE && Math.abs(coin.y - y) < COIN_SIZE) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 找到最低可用位置
        function findSettlePosition(currentX, currentY) {
            // 網格化落腳，像俄羅斯方塊
            const gridX = Math.round(currentX / COIN_SIZE) * COIN_SIZE;
            
            for (let y = GROUND_Y; y >= 0; y -= COIN_SIZE) {
                const hasSupport = y >= GROUND_Y || isPositionOccupied(gridX, y + COIN_SIZE);
                const isFree = !isPositionOccupied(gridX, y);
                
                if (isFree && hasSupport && currentY >= y - COIN_SIZE) {
                    return { x: gridX, y };
                }
            }
            return null;
        }

        // ====================================
        // 畫面填滿檢測（所有欄位堆到頂端）
        // ====================================
        function isScreenFilled() {
            const columns = Math.floor((RIGHT_MARGIN - LEFT_MARGIN) / COIN_SIZE);
            const heights = new Array(columns).fill(0);
            
            // 計算每一欄的最高堆疊高度
            for (const coin of coins) {
                if (!coin.settled) continue;
                const colIndex = Math.round((coin.x - LEFT_MARGIN) / COIN_SIZE);
                if (colIndex < 0 || colIndex >= columns) continue;
                const topY = coin.y; // y 越小越靠上
                heights[colIndex] = Math.max(heights[colIndex], (GROUND_Y - topY) + COIN_SIZE);
            }
            
            // 若每一欄的高度都達到可視高度，視為填滿
            const requiredHeight = GROUND_Y; // 從 0 到地面視為可堆疊區域
            const allFilled = heights.every(h => h >= requiredHeight);
            
            console.log('🧱 欄位高度:', heights, '是否填滿:', allFilled);
            return allFilled;
        }

        // 取得目前堆疊最高點（y 越小越高）。若沒有 settled 硬幣則回傳 null。
        function getHighestStackTopY() {
            let minY = null;
            for (const coin of coins) {
                if (!coin.settled) continue;
                if (minY === null || coin.y < minY) {
                    minY = coin.y;
                }
            }
            return minY;
        }

        // 生成硬幣（同步生成）
        function spawnCoins(count = 30) {
            // 網格化隨機掉落，像俄羅斯方塊
            const availableWidth = RIGHT_MARGIN - LEFT_MARGIN - COIN_SIZE;
            const gridWidth = Math.floor(availableWidth / COIN_SIZE);
            
            for (let i = 0; i < count; i++) {
                // 隨機選擇網格位置
                const randomGridX = Math.floor(Math.random() * gridWidth);
                const gridX = LEFT_MARGIN + randomGridX * COIN_SIZE;
                
                const newCoin = new Coin(
                    gridX,
                    -COIN_SIZE * 2 - (i * COIN_SIZE * 0.8),
                    0,
                    COIN_SIZE
                );
                
                coins.push(newCoin);
            }
        }

        // 分散時序掉落：在 durationMs 期間內平均分配，並加入少量隨機抖動
        function spawnCoinsStaggered(count = 150, durationMs = 5000) {
            const step = durationMs / count;
            for (let i = 0; i < count; i++) {
                const jitter = (Math.random() - 0.5) * step * 0.5; // ±25% 抖動
                const delay = Math.max(0, Math.floor(i * step + jitter));
                setTimeout(() => {
                    spawnCoins(1);
                }, delay);
            }
        }

        async function handleRecordingStart() {
            if (AppState.isRecording) return;
            
            try {
                // 請求麥克風權限
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    } 
                });
                
                // 設定音訊分析 (視覺化)
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(audioStream);
                source.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                // 啟動波紋動畫更新循環
                startRippleAnimation();
                
                // 建立 MediaRecorder
                mediaRecorder = new MediaRecorder(audioStream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                
                audioChunks = [];
                recordingStartTime = Date.now();
                
                mediaRecorder.addEventListener('dataavailable', event => {
                    audioChunks.push(event.data);
                });
                
                mediaRecorder.start();
                
                AppState.isRecording = true;
                AppState.currentState = SystemState.RECORDING;
                
                // 更新 UI：移除 idle，加入 recording
                micContainerEl.classList.remove('idle');
                micContainerEl.classList.add('recording');
                
                console.log('🎤 開始錄音...');
                playSound('start');
                updateDebugInfo();
                
            } catch (error) {
                console.error('❌ 無法存取麥克風:', error);
                alert('無法存取麥克風，請檢查權限設定');
            }
        }

        // 波紋動畫邏輯
        function startRippleAnimation() {
            if (rippleInterval) clearInterval(rippleInterval);
            
            // 每 100ms 檢查一次音量並產生波紋
            rippleInterval = setInterval(() => {
                if (!AppState.isRecording || !analyser) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                // 計算平均音量
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const average = sum / dataArray.length;
                
                // 如果音量超過閾值，產生波紋
                if (average > 10) { // 閾值可調整
                    createRipple(average);
                }
            }, 100);
        }
        
        function createRipple(intensity) {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple-circle');
            
            // 根據音量調整大小與透明度
            const scale = 1 + (intensity / 50); // 調整擴散大小
            const opacity = Math.min(0.8, intensity / 100);
            
            // 設定初始樣式
            ripple.style.width = '100%';
            ripple.style.height = '100%';
            ripple.style.opacity = opacity;
            ripple.style.transform = 'translate(-50%, -50%) scale(1)';
            
            micRipplesEl.appendChild(ripple);
            
            // 強制重繪以觸發 transition
            void ripple.offsetWidth;
            
            // 執行動畫
            ripple.style.transform = `translate(-50%, -50%) scale(${scale * 2})`;
            ripple.style.opacity = '0';
            
            // 清理 DOM
            setTimeout(() => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            }, 1000); // 與 CSS transition 時間匹配
        }

        async function handleRecordingEnd() {
            if (!AppState.isRecording || !mediaRecorder) return;
            
            // 停止錄音狀態
            AppState.isRecording = false;
            AppState.currentState = SystemState.PROCESSING;
            
            // 清除波紋動畫
            if (rippleInterval) {
                clearInterval(rippleInterval);
                rippleInterval = null;
            }
            
            // 更新 UI：恢復 UI 狀態
            micContainerEl.classList.remove('recording');
            // 讓麥克風消失或變回原狀，這裡選擇隱藏整個引導畫面來展示金幣
            // 但根據需求：先等待 5 秒
            
            console.log('⏹️ 停止錄音，進入 5 秒緩衝...');
            playSound('end');
            
            // 停止錄音
            mediaRecorder.stop();
            
            // 5 秒緩衝等待（給用戶平靜的時間）
            setTimeout(() => {
                 hideGuideMessage();
                 micContainerEl.classList.add('idle'); // 恢復呼吸狀態
            }, 5000);
            
            // 處理錄音數據 (此部分不變，在背景執行)
            mediaRecorder.addEventListener('stop', async () => {
                const recordingDuration = Math.round((Date.now() - recordingStartTime) / 1000);
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                
                // 停止音訊串流與 Context
                audioStream.getTracks().forEach(track => track.stop());
                if (audioContext) audioContext.close();
                
                // 處理錄音
                await processRecording(audioBlob, recordingDuration);
            });
            
            updateDebugInfo();
        }

        async function processRecording(audioBlob, duration) {
            try {
                console.log('📤 上傳日記到伺服器...');
                
                // 將音訊轉為 base64（簡化方案，實際可上傳至 Firebase Storage）
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                
                reader.onloadend = async () => {
                    const audioData = reader.result; // dataURL base64
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/save-diary`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userId: 'default-user',
                                mode: 'stt',
                                audioBase64: audioData,
                                duration: duration,
                                date: new Date().toISOString()
                            })
                        });
                        
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(data?.error || '儲存日記失敗');
                        }
                        
                        console.log('✅ 日記已儲存:', data);
                    } catch (error) {
                        console.error('❌ 儲存日記失敗:', error);
                    } finally {
                        // 即使儲存失敗，也給予獎勵，避免中斷體驗
                        // 確保至少等待 5 秒（從錄音結束開始算）
                        const elapsed = Date.now() - (recordingStartTime + duration * 1000);
                        const remainingWait = Math.max(0, 5000 - elapsed);
                        
                        setTimeout(() => {
                            AppState.currentState = SystemState.REWARD;
                            giveReward();
                            updateDebugInfo();
                            // 隱藏引導畫面（若尚未隱藏）
                            hideGuideMessage();
                        }, remainingWait);
                    }
                };
                
            } catch (error) {
                console.error('❌ 處理錄音失敗:', error);
                // 即使失敗也給予獎勵（使用者體驗優先）
                setTimeout(() => {
                    AppState.currentState = SystemState.REWARD;
                    giveReward();
                    updateDebugInfo();
                    hideGuideMessage();
                }, 5000);
            }
        }

        // ====================================
        // 全螢幕功能
        // ====================================
        function setupFullscreen() {
            const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
            const enterFullscreenBtn = document.getElementById('enterFullscreenBtn');
            const fullscreenPrompt = document.getElementById('fullscreenPrompt');
            const container = document.querySelector('.container');
            
            // 進入全螢幕的函數
            async function enterFullscreen() {
                try {
                    if (container.requestFullscreen) {
                        await container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        await container.webkitRequestFullscreen();
                    } else if (container.mozRequestFullScreen) {
                        await container.mozRequestFullScreen();
                    } else if (container.msRequestFullscreen) {
                        await container.msRequestFullscreen();
                    }
                    console.log('✅ 已進入全螢幕模式');
                    // 隱藏提示
                    fullscreenPrompt.classList.add('hidden');
                } catch (error) {
                    console.error('❌ 無法進入全螢幕:', error);
                    alert('無法進入全螢幕模式，請檢查瀏覽器權限設定');
                }
            }
            
            // 退出全螢幕的函數
            async function exitFullscreen() {
                try {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        await document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        await document.msExitFullscreen();
                    }
                    console.log('✅ 已退出全螢幕模式');
                } catch (error) {
                    console.error('❌ 無法退出全螢幕:', error);
                }
            }
            
            // 檢查是否在全螢幕模式
            function isFullscreen() {
                return !!(document.fullscreenElement || 
                         document.webkitFullscreenElement || 
                         document.mozFullScreenElement || 
                         document.msFullscreenElement);
            }
            
            // 點擊進入全螢幕按鈕
            enterFullscreenBtn.addEventListener('click', enterFullscreen);
            
            // 點擊退出按鈕
            exitFullscreenBtn.addEventListener('click', exitFullscreen);
            
            // 監聽全螢幕狀態變化
            function updateFullscreenState() {
                const isFull = isFullscreen();
                if (isFull) {
                    // 進入全螢幕時隱藏提示
                    fullscreenPrompt.classList.add('hidden');
                } else {
                    // 退出全螢幕時顯示提示（可選）
                    // fullscreenPrompt.classList.remove('hidden');
                }
                console.log('全螢幕狀態:', isFull ? '開啟' : '關閉');
            }
            
            document.addEventListener('fullscreenchange', updateFullscreenState);
            document.addEventListener('webkitfullscreenchange', updateFullscreenState);
            document.addEventListener('mozfullscreenchange', updateFullscreenState);
            document.addEventListener('MSFullscreenChange', updateFullscreenState);
            
            // ESC 鍵退出全螢幕（瀏覽器預設行為）
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isFullscreen()) {
                    exitFullscreen();
                }
                // F11 鍵切換全螢幕
                if (e.key === 'F11') {
                    e.preventDefault();
                    if (isFullscreen()) {
                        exitFullscreen();
                    } else {
                        enterFullscreen();
                    }
                }
            });
            
            // 檢查是否已經在全螢幕模式（例如從其他方式進入）
            if (isFullscreen()) {
                fullscreenPrompt.classList.add('hidden');
            }
            
            // 暴露給 Console 使用
            window.enterFullscreen = enterFullscreen;
            window.exitFullscreen = exitFullscreen;
            window.isFullscreen = isFullscreen;
        }

║ exitFullscreen() - 退出全螢幕模式              ║
╚════════════════════════════════════════════════╝
                `);
            };

            window.debug = function() {
                AppState.debugMode = !AppState.debugMode;
                debugInfoEl.classList.toggle('show');
                updateDebugInfo();
                console.log('🐛 除錯模式:', AppState.debugMode ? '開啟' : '關閉');
            };

            window.showGuide = function() {
                showDailyGuide();
            };

            window.hideGuide = function() {
                hideGuideMessage();
            };

            window.startRecord = function() {
                handleRecordingStart();
            };

            window.stopRecord = function() {
                handleRecordingEnd();
            };

            window.addCoins = function(count = 150, durationMs = 6000) {
                AppState.totalCoins += count;
                saveCoinsToStorage();
                spawnCoinsStaggered(count, durationMs);
                updateDebugInfo();
                console.log(`💰 增加 ${count} 枚金幣（分散 ${durationMs}ms）！總計: ${AppState.totalCoins}`);
                
                setTimeout(() => {
                    if (isScreenFilled()) {
                        console.log('🎉 畫面已填滿，準備列印');
                    }
                }, durationMs + 1500);
            };

            window.showPrint = function() {
                triggerPrintNotification();
            };

            window.hidePrint = function() {
                hidePrintNotification();
            };

            window.resetCoins = function() {
                AppState.totalCoins = 0;
                saveCoinsToStorage();
                coins = [];
                updateDebugInfo();
                console.log('🔄 金幣數已重置');
            };

            window.getState = function() {
                console.log('📊 當前狀態:', {
                    state: AppState.currentState,
                    totalCoins: AppState.totalCoins,
                    threshold: AppState.coinThreshold,
                    isRecording: AppState.isRecording,
                    guideText: AppState.currentGuideText
                });
                return AppState;
            };

            window.setThreshold = function(n) {
                AppState.coinThreshold = n;
                document.getElementById('debugTarget').textContent = n;
                console.log(`🎯 列印門檻設定為: ${n}`);
            };

            // ===== 引導語排程 =====
            window.setGuide = function(h = 22, m = 0) {
                AppState.guideHour = Math.max(0, Math.min(23, parseInt(h, 10)));
                AppState.guideMinute = Math.max(0, Math.min(59, parseInt(m, 10)));
                saveGuideScheduleToStorage();
                console.log(`🕙 引導語時間設定為：${AppState.guideHour.toString().padStart(2,'0')}:${AppState.guideMinute.toString().padStart(2,'0')}`);
            };

            window.enableGuide = function(enabled = true) {
                AppState.guideEnabled = !!enabled;
                saveGuideScheduleToStorage();
                console.log(`🧭 引導語排程：${AppState.guideEnabled ? '啟用' : '關閉'}`);
            };

            window.checkGuideNow = function() {
                maybeShowScheduledGuide();
            };

            window.resetGuideToday = function() {
                AppState.lastGuideShownDate = null;
                saveGuideScheduleToStorage();
                console.log('🔄 已清除今日引導語顯示記錄');
            };

            // 全螢幕相關指令
            window.enterFullscreen = function() {
                const container = document.querySelector('.container');
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.mozRequestFullScreen) {
                    container.mozRequestFullScreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            };

            window.exitFullscreen = function() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            };
        }

        // 清理函數
        function cleanup() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }

        window.addEventListener('beforeunload', cleanup);
    </script>
</body>
</html>
