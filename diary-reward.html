<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素風格硬幣堆疊系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, system-ui, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            width: 1080px;
            height: 1920px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 1080/1920;
        }

        .coin-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            object-fit: contain;
        }

        .voice-indicator {
            position: absolute;
            top: 170px;
            right: 410px;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        .voice-dots {
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        .voice-dot {
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            image-rendering: pixelated;
        }

        .voice-indicator.active .voice-dot {
            animation: voice-bounce 1.2s ease-in-out infinite;
        }

        .voice-indicator.active .voice-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .voice-indicator.active .voice-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes voice-bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-16px);
            }
        }

        /* 引導語顯示區域（滿版黃底黑字） */
        .guide-message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 60px;
            background-color: #FFD700; /* 與金幣相同黃色 */
            color: #000000;
            text-align: center;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            font-size: 36px;
            line-height: 1.7;
            font-weight: bold;
            letter-spacing: 1px;
            image-rendering: pixelated;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 50;
        }

        .guide-message.show {
            opacity: 1;
            pointer-events: auto;
        }

        .guide-message .guide-text {
            margin-bottom: 24px;
            color: #000000;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .guide-message .guide-hint {
            font-size: 22px;
            color: #000000;
            opacity: 0.8;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 列印提示區域 */
        .print-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            padding: 60px 40px;
            background-color: rgba(255, 215, 0, 0.95);
            border: 4px solid #ffffff;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 20;
        }

        .print-notification.show {
            opacity: 1;
            pointer-events: auto;
        }

        .print-notification .print-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .print-notification .print-title {
            font-size: 36px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            letter-spacing: 1px;
        }

        .print-notification .print-message {
            font-size: 24px;
            color: #333333;
            line-height: 1.5;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 狀態指示器（測試用） */
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            z-index: 100;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        /* 退出全螢幕按鈕 */
        .exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        .exit-fullscreen-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .exit-fullscreen-btn:active {
            transform: scale(0.95);
        }

        /* 全螢幕時顯示退出按鈕 */
        :fullscreen .exit-fullscreen-btn,
        :-webkit-full-screen .exit-fullscreen-btn,
        :-moz-full-screen .exit-fullscreen-btn,
        :-ms-fullscreen .exit-fullscreen-btn {
            display: flex;
        }

        /* 進入全螢幕提示 */
        .fullscreen-prompt {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: #ffffff;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            text-align: center;
            padding: 40px;
        }

        .fullscreen-prompt.hidden {
            display: none;
        }

        .fullscreen-prompt h2 {
            font-size: 64px;
            margin-bottom: 60px;
            color: #FFD700;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 4px 4px 0px rgba(255, 215, 0, 0.3);
        }

        .fullscreen-prompt p {
            font-size: 28px;
            margin-bottom: 80px;
            line-height: 1.8;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .fullscreen-prompt-btn {
            padding: 30px 80px;
            font-size: 36px;
            background-color: #FFD700;
            color: #000000;
            border: 4px solid #ffffff;
            cursor: pointer;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            font-weight: bold;
            transition: all 0.2s ease;
            border-radius: 0;
            letter-spacing: 2px;
            image-rendering: pixelated;
            box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.3);
        }

        .fullscreen-prompt-btn:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.3);
        }

        .fullscreen-prompt-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 2px 2px 0px rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 1080px) {
            .canvas-container {
                width: 100vw;
                height: 100vh;
            }
            
            .voice-indicator {
                top: 40px;
                right: 40px;
            }
            
            .voice-dot {
                width: 10px;
                height: 10px;
            }

            .guide-message {
                font-size: 24px;
                padding: 40px 24px;
                font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
                font-weight: bold;
                letter-spacing: 1px;
            }

            .print-notification {
                padding: 40px 30px;
            }

            .print-notification .print-icon {
                font-size: 60px;
            }

            .print-notification .print-title {
                font-size: 28px;
            }

            .print-notification .print-message {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="coinCanvas" class="coin-canvas"></canvas>
            
            <!-- 語音指示器 -->
            <div class="voice-indicator" id="voiceIndicator">
                <div class="voice-dots">
                    <div class="voice-dot"></div>
                    <div class="voice-dot"></div>
                    <div class="voice-dot"></div>
                </div>
            </div>

            <!-- 引導語顯示 -->
            <div class="guide-message" id="guideMessage">
                <div class="guide-text" id="guideText"></div>
                <div class="guide-hint">輕觸開關開始記錄</div>
            </div>

            <!-- 列印提示 -->
            <div class="print-notification" id="printNotification">
                <div class="print-icon">📄</div>
                <div class="print-title">恭喜你！</div>
                <div class="print-message" id="printMessage">
                    已累積足夠金幣<br>
                    正在列印你的紙籤...
                </div>
            </div>

            <!-- 除錯資訊 -->
            <div class="debug-info" id="debugInfo">
                <div>狀態: <span id="debugState">待機</span></div>
                <div>金幣數: <span id="debugCoins">0</span></div>
                <div>目標: <span id="debugTarget">30</span></div>
                <div>錄音: <span id="debugRecording">否</span></div>
            </div>
        </div>

        <!-- 退出全螢幕按鈕 -->
        <button class="exit-fullscreen-btn" id="exitFullscreenBtn" title="退出全螢幕 (ESC)">✕</button>

        <!-- 進入全螢幕提示 -->
        <div class="fullscreen-prompt" id="fullscreenPrompt">
            <h2>🪙 金幣日記系統</h2>
            <p>點擊下方按鈕進入全螢幕模式<br>獲得最佳體驗</p>
            <button class="fullscreen-prompt-btn" id="enterFullscreenBtn">進入全螢幕</button>
        </div>
    </div>

    <script>
        // ====================================
        // API 基礎路徑設定
        // ====================================
        // 自動判斷環境：
        // - file:// 協議 → 使用線上 Vercel API
        // - localhost → 使用本地 API
        // - 線上環境 → 使用相對路徑（同域名）
        let API_BASE_URL = '';
        if (window.location.protocol === 'file:') {
            // 如果是 file:// 打開，使用線上 API
            API_BASE_URL = 'https://yuhsiang.vercel.app';
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            // 本地開發環境
            API_BASE_URL = 'http://localhost:3000';
        } else {
            // 線上環境使用相對路徑（同域名）
            API_BASE_URL = '';
        }

        // ====================================
        // 硬幣類別
        // ====================================
        class Coin {
            constructor(x, y, velocityY, size) {
                this.x = x;
                this.y = y;
                this.velocityY = velocityY;
                this.size = size;
                this.settled = false;
            }
        }

        // ====================================
        // 全域變數
        // ====================================
        let canvas;
        let ctx;
        let animationId;
        let coins = [];

        // 設定參數
        const COIN_SIZE = 32;
        const GRAVITY = 0.8;
        const GROUND_Y = 1920 - 100;
        const LEFT_MARGIN = 100;
        const RIGHT_MARGIN = 1080 - 100;

        // ====================================
        // 系統狀態管理
        // ====================================
        const SystemState = {
            IDLE: 'idle',                    // 待機（顯示引導語）
            RECORDING: 'recording',          // 錄音中
            PROCESSING: 'processing',        // 處理中
            REWARD: 'reward',                // 獎勵動畫
            PRINT_READY: 'print_ready'       // 準備列印
        };

        const AppState = {
            currentState: SystemState.IDLE,
            totalCoins: 0,
            coinThreshold: 30,              // 列印門檻
            isRecording: false,
            currentGuideText: '',
            debugMode: false,
            // 引導語排程（預設 22:00 顯示一次）
            guideEnabled: true,
            guideHour: 22,
            guideMinute: 0,
            lastGuideShownDate: null
        };

        // UI 元素
        let guideMessageEl, guideTextEl;
        let printNotificationEl, printMessageEl;
        let debugInfoEl, debugStateEl, debugCoinsEl, debugRecordingEl;
        let voiceIndicatorEl;

        // ====================================
        // 初始化
        // ====================================
        document.addEventListener('DOMContentLoaded', function() {
            // Canvas 初始化
            canvas = document.getElementById('coinCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1920;
            ctx.imageSmoothingEnabled = false;
            
            // UI 元素初始化
            guideMessageEl = document.getElementById('guideMessage');
            guideTextEl = document.getElementById('guideText');
            printNotificationEl = document.getElementById('printNotification');
            printMessageEl = document.getElementById('printMessage');
            debugInfoEl = document.getElementById('debugInfo');
            debugStateEl = document.getElementById('debugState');
            debugCoinsEl = document.getElementById('debugCoins');
            debugRecordingEl = document.getElementById('debugRecording');
            voiceIndicatorEl = document.getElementById('voiceIndicator');
            
            // 設定語音指示器
            setupVoiceIndicator();
            
            // 開始動畫
            startAnimation();
            
            // 初始化系統狀態
            initializeSystem();
            
            // 設定 Console 測試指令
            setupConsoleCommands();
            
            // 設定全螢幕功能
            setupFullscreen();
            
            console.log('🎮 系統已啟動！輸入 help() 查看測試指令');
        });

        // 開始動畫循環
        function startAnimation() {
            if (typeof window.__printedRoundFlag === 'undefined') {
                window.__printedRoundFlag = false;
            }
            function animate() {
                // 清除畫布
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 繪製地面線
                ctx.fillStyle = '#333333';
                ctx.fillRect(LEFT_MARGIN, GROUND_Y, RIGHT_MARGIN - LEFT_MARGIN, 2);
                
                // （已移除）背景直條格線
                
                // 更新和繪製硬幣
                coins.forEach((coin) => {
                    if (!coin.settled) {
                        // 應用重力
                        coin.velocityY += GRAVITY;
                        coin.y += coin.velocityY;
                        
                        // 檢查是否應該落腳
                        const settlePos = findSettlePosition(coin.x, coin.y);
                        
                        if (settlePos && coin.y >= settlePos.y - COIN_SIZE / 2) {
                            coin.x = settlePos.x;
                            coin.y = settlePos.y;
                            coin.settled = true;
                            coin.velocityY = 0;
                        }
                    }
                    
                    // 繪製硬幣
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(Math.floor(coin.x), Math.floor(coin.y), coin.size, coin.size);
                });
                
                // 計算目前堆疊最高點
                const highestTopY = getHighestStackTopY();
                
                // 取得語音指示器相對於畫布的 Y（以畫布座標）
                const indicatorRect = voiceIndicatorEl.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();
                const indicatorCenterYClient = ((indicatorRect.top + indicatorRect.bottom) / 2) - canvasRect.top;
                const scaleY = canvas.height / canvasRect.height;
                const indicatorCenterY = indicatorCenterYClient * scaleY; // 轉為畫布座標
                
                // 當堆疊高度達到或超過語音指示器位置，觸發列印（僅一次）
                if (!window.__printedRoundFlag && highestTopY !== null && highestTopY <= indicatorCenterY) {
                    window.__printedRoundFlag = true;
                    triggerPrintNotification();
                }
                
                animationId = requestAnimationFrame(animate);
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // 檢查位置是否被佔用
        function isPositionOccupied(x, y) {
            for (const coin of coins) {
                if (coin.settled) {
                    if (Math.abs(coin.x - x) < COIN_SIZE && Math.abs(coin.y - y) < COIN_SIZE) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 找到最低可用位置
        function findSettlePosition(currentX, currentY) {
            // 網格化落腳，像俄羅斯方塊
            const gridX = Math.round(currentX / COIN_SIZE) * COIN_SIZE;
            
            for (let y = GROUND_Y; y >= 0; y -= COIN_SIZE) {
                const hasSupport = y >= GROUND_Y || isPositionOccupied(gridX, y + COIN_SIZE);
                const isFree = !isPositionOccupied(gridX, y);
                
                if (isFree && hasSupport && currentY >= y - COIN_SIZE) {
                    return { x: gridX, y };
                }
            }
            return null;
        }

        // ====================================
        // 畫面填滿檢測（所有欄位堆到頂端）
        // ====================================
        function isScreenFilled() {
            const columns = Math.floor((RIGHT_MARGIN - LEFT_MARGIN) / COIN_SIZE);
            const heights = new Array(columns).fill(0);
            
            // 計算每一欄的最高堆疊高度
            for (const coin of coins) {
                if (!coin.settled) continue;
                const colIndex = Math.round((coin.x - LEFT_MARGIN) / COIN_SIZE);
                if (colIndex < 0 || colIndex >= columns) continue;
                const topY = coin.y; // y 越小越靠上
                heights[colIndex] = Math.max(heights[colIndex], (GROUND_Y - topY) + COIN_SIZE);
            }
            
            // 若每一欄的高度都達到可視高度，視為填滿
            const requiredHeight = GROUND_Y; // 從 0 到地面視為可堆疊區域
            const allFilled = heights.every(h => h >= requiredHeight);
            
            console.log('🧱 欄位高度:', heights, '是否填滿:', allFilled);
            return allFilled;
        }

        // 取得目前堆疊最高點（y 越小越高）。若沒有 settled 硬幣則回傳 null。
        function getHighestStackTopY() {
            let minY = null;
            for (const coin of coins) {
                if (!coin.settled) continue;
                if (minY === null || coin.y < minY) {
                    minY = coin.y;
                }
            }
            return minY;
        }

        // 生成硬幣（同步生成）
        function spawnCoins(count = 30) {
            // 網格化隨機掉落，像俄羅斯方塊
            const availableWidth = RIGHT_MARGIN - LEFT_MARGIN - COIN_SIZE;
            const gridWidth = Math.floor(availableWidth / COIN_SIZE);
            
            for (let i = 0; i < count; i++) {
                // 隨機選擇網格位置
                const randomGridX = Math.floor(Math.random() * gridWidth);
                const gridX = LEFT_MARGIN + randomGridX * COIN_SIZE;
                
                const newCoin = new Coin(
                    gridX,
                    -COIN_SIZE * 2 - (i * COIN_SIZE * 0.8),
                    0,
                    COIN_SIZE
                );
                
                coins.push(newCoin);
            }
        }

        // 分散時序掉落：在 durationMs 期間內平均分配，並加入少量隨機抖動
        function spawnCoinsStaggered(count = 150, durationMs = 5000) {
            const step = durationMs / count;
            for (let i = 0; i < count; i++) {
                const jitter = (Math.random() - 0.5) * step * 0.5; // ±25% 抖動
                const delay = Math.max(0, Math.floor(i * step + jitter));
                setTimeout(() => {
                    spawnCoins(1);
                }, delay);
            }
        }

        // 設定語音指示器
        function setupVoiceIndicator() {
            const voiceIndicator = document.getElementById('voiceIndicator');
            let clickTimer = null;
            let isLongPress = false;
            let hasMoved = false;
            
            // 單擊切換全螢幕
            voiceIndicator.addEventListener('click', function(e) {
                // 只有在不是長按且沒有移動時才切換全螢幕
                if (!isLongPress && !hasMoved) {
                    toggleFullscreen();
                }
            });
            
            // 長按開始錄音
            voiceIndicator.addEventListener('pointerdown', function(e) {
                isLongPress = false;
                hasMoved = false;
                clickTimer = setTimeout(() => {
                    isLongPress = true;
                    handleRecordingStart();
                }, 500); // 500ms 後視為長按
            });
            
            // 偵測移動（如果移動了就不算點擊）
            voiceIndicator.addEventListener('pointermove', function(e) {
                if (clickTimer) {
                    hasMoved = true;
                }
            });
            
            voiceIndicator.addEventListener('pointerup', function() {
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                if (AppState.isRecording) {
                    handleRecordingEnd();
                }
                // 重置狀態
                setTimeout(() => {
                    isLongPress = false;
                    hasMoved = false;
                }, 100);
            });
            
            voiceIndicator.addEventListener('pointerleave', function() {
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                if (AppState.isRecording) {
                    handleRecordingEnd();
                }
                // 重置狀態
                setTimeout(() => {
                    isLongPress = false;
                    hasMoved = false;
                }, 100);
            });
        }

        // 全螢幕切換功能
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                // 進入全螢幕
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
                console.log('🖥️ 進入全螢幕模式');
            } else {
                // 退出全螢幕
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                console.log('🖥️ 退出全螢幕模式');
            }
        }

        // ====================================
        // 系統初始化
        // ====================================
        function initializeSystem() {
            // 載入儲存的金幣數
            loadCoinsFromStorage();
            loadGuideScheduleFromStorage();
            
            // 顯示當日引導語
            maybeShowScheduledGuide();
            
            // 更新除錯資訊
            updateDebugInfo();

            // 啟動每分鐘排程檢查
            setInterval(maybeShowScheduledGuide, 60 * 1000);
        }

        // ====================================
        // 引導語系統
        // ====================================
        function loadGuideScheduleFromStorage() {
            const raw = localStorage.getItem('guideSchedule');
            if (!raw) return;
            try {
                const obj = JSON.parse(raw);
                AppState.guideEnabled = obj.enabled ?? AppState.guideEnabled;
                AppState.guideHour = obj.hour ?? AppState.guideHour;
                AppState.guideMinute = obj.minute ?? AppState.guideMinute;
                AppState.lastGuideShownDate = obj.lastDate ?? null;
            } catch {}
        }

        function saveGuideScheduleToStorage() {
            const payload = {
                enabled: AppState.guideEnabled,
                hour: AppState.guideHour,
                minute: AppState.guideMinute,
                lastDate: AppState.lastGuideShownDate
            };
            localStorage.setItem('guideSchedule', JSON.stringify(payload));
        }

        function maybeShowScheduledGuide() {
            if (!AppState.guideEnabled) return;
            const now = new Date();
            const currentDate = now.toISOString().slice(0, 10);
            const alreadyShownToday = AppState.lastGuideShownDate === currentDate;
            if (alreadyShownToday) return;
            if (now.getHours() > AppState.guideHour || (now.getHours() === AppState.guideHour && now.getMinutes() >= AppState.guideMinute)) {
                showDailyGuide();
                AppState.lastGuideShownDate = currentDate;
                saveGuideScheduleToStorage();
            }
        }

        async function showDailyGuide() {
            try {
                // 先顯示載入中的簡短字樣，避免空白
                guideTextEl.textContent = '生成引導語中…';
                guideMessageEl.classList.add('show');

                const resp = await fetch(`${API_BASE_URL}/api/generate-guide`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userId: 'default-user',
                        date: new Date().toISOString().slice(0,10),
                        daysToAnalyze: 7
                    })
                });
                if (!resp.ok) throw new Error('API 失敗');
                const data = await resp.json();
                const text = (data.guideText || '').trim();
                AppState.currentGuideText = text;
                guideTextEl.textContent = text || '今晚想對自己說些什麼？';
                console.log(`📝 顯示引導語(From API, 基於 ${data.basedOnDiaries || 0} 筆日記):`, text);
            } catch (e) {
                console.error('取得引導語失敗，改用預設樣本：', e);
                const fallback = '今晚想對自己說些什麼？';
                AppState.currentGuideText = fallback;
                guideTextEl.textContent = fallback;
                guideMessageEl.classList.add('show');

        }

        function hideGuideMessage() {
            guideMessageEl.classList.remove('show');
        }

        // ====================================
        // 錄音處理
        // ====================================
        let mediaRecorder;
        let audioChunks = [];
        let audioStream;
        let recordingStartTime;

        async function handleRecordingStart() {
            if (AppState.isRecording) return;
            
            try {
                // 請求麥克風權限
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    } 
                });
                
                // 建立 MediaRecorder
                mediaRecorder = new MediaRecorder(audioStream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                
                audioChunks = [];
                recordingStartTime = Date.now();
                
                mediaRecorder.addEventListener('dataavailable', event => {
                    audioChunks.push(event.data);
                });
                
                mediaRecorder.start();
                
                AppState.isRecording = true;
                AppState.currentState = SystemState.RECORDING;
                
                // 更新 UI
                document.getElementById('voiceIndicator').classList.add('active');
                
                console.log('🎤 開始錄音...');
                playSound('start');
                updateDebugInfo();
                
            } catch (error) {
                console.error('❌ 無法存取麥克風:', error);
                alert('無法存取麥克風，請檢查權限設定');
            }
        }

        async function handleRecordingEnd() {
            if (!AppState.isRecording || !mediaRecorder) return;
            
            AppState.isRecording = false;
            AppState.currentState = SystemState.PROCESSING;
            
            // 更新 UI
            document.getElementById('voiceIndicator').classList.remove('active');
            hideGuideMessage();
            
            console.log('⏹️ 停止錄音，開始處理...');
            playSound('end');
            
            // 停止錄音
            mediaRecorder.stop();
            
            // 等待錄音數據就緒
            mediaRecorder.addEventListener('stop', async () => {
                const recordingDuration = Math.round((Date.now() - recordingStartTime) / 1000);
                
                // 建立音訊 Blob
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                
                // 停止音訊串流
                audioStream.getTracks().forEach(track => track.stop());
                
                // 處理錄音
                await processRecording(audioBlob, recordingDuration);
            });
            
            updateDebugInfo();
        }

        async function processRecording(audioBlob, duration) {
            try {
                console.log('📤 上傳日記到伺服器...');
                
                // 將音訊轉為 base64（簡化方案，實際可上傳至 Firebase Storage）
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                
                reader.onloadend = async () => {
                    const audioData = reader.result; // dataURL base64
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/save-diary`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userId: 'default-user',
                                mode: 'stt',
                                audioBase64: audioData,
                                duration: duration,
                                date: new Date().toISOString()
                            })
                        });
                        
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(data?.error || '儲存日記失敗');
                        }
                        
                        console.log('✅ 日記已儲存:', data);
                    } catch (error) {
                        console.error('❌ 儲存日記失敗:', error);
                    } finally {
                        // 即使儲存失敗，也給予獎勵，避免中斷體驗
                        AppState.currentState = SystemState.REWARD;
                        giveReward();
                        updateDebugInfo();
                    }
                };
                
            } catch (error) {
                console.error('❌ 處理錄音失敗:', error);
                // 即使失敗也給予獎勵（使用者體驗優先）
                AppState.currentState = SystemState.REWARD;
                giveReward();
                updateDebugInfo();
            }
        }

        // ====================================
        // 獎勵系統
        // ====================================
        function giveReward() {
            // 掉落金幣（分散時序 150 枚）
            const dropCount = 150;
            const durationMs = 6000; // 6 秒內分散掉落
            spawnCoinsStaggered(dropCount, durationMs);
            
            // 更新金幣數（作為統計用途）
            AppState.totalCoins += dropCount;
            saveCoinsToStorage();
            
            console.log(`💰 獲得 ${dropCount} 枚金幣（分散掉落）！總計:`, AppState.totalCoins);
            
            // 列印觸發改由動畫迴圈根據堆疊高度偵測（達到白色點高度）
            
            // 回到待機狀態
            setTimeout(() => {
                AppState.currentState = SystemState.IDLE;
                updateDebugInfo();
            }, durationMs + 2000);
            
            updateDebugInfo();
        }

        // ====================================
        // 列印通知
        // ====================================
        function triggerPrintNotification() {
            AppState.currentState = SystemState.PRINT_READY;
            
            printMessageEl.innerHTML = `
                已累積 ${AppState.totalCoins} 枚金幣！<br>
                正在列印你的專屬紙籤...
            `;
            
            printNotificationEl.classList.add('show');
            
            console.log('🎉 觸發列印通知！');
            
            // TODO: 觸發實體列印
            executePrint();
            
            // 5秒後隱藏通知
            setTimeout(() => {
                hidePrintNotification();
            }, 5000);
            
            updateDebugInfo();
        }

        function hidePrintNotification() {
            printNotificationEl.classList.remove('show');
            
            // 重置金幣數
            AppState.totalCoins = 0;
            saveCoinsToStorage();
            
            // 清空畫面上的金幣
            coins = [];
            
            // 回到待機狀態
            AppState.currentState = SystemState.IDLE;
            // 允許下一回合再次觸發
            window.__printedRoundFlag = false;
            
            updateDebugInfo();
        }

        async function executePrint() {
            try {
                console.log('🖨️ 執行列印程序...');

                    method: 'POST',

                console.log(`📄 列印內容(From API, 基於 ${data.basedOnDiaries || 0} 筆日記):`, printText);

        // ====================================
        // 資料儲存
        // ====================================
        function saveCoinsToStorage() {
            localStorage.setItem('totalCoins', AppState.totalCoins.toString());
        }

        function loadCoinsFromStorage() {
            const saved = localStorage.getItem('totalCoins');
            if (saved) {
                AppState.totalCoins = parseInt(saved, 10);
                console.log('💾 載入已儲存的金幣數:', AppState.totalCoins);

        }

        // ====================================
        // 音效系統
        // ====================================
        function playSound(type) {
            // TODO: 使用 Web Audio API 或音檔
            console.log('🔊 播放音效:', type);
        }

        // ====================================
        // 除錯工具
        // ====================================
        function updateDebugInfo() {
            if (!AppState.debugMode) return;
            
            debugStateEl.textContent = AppState.currentState;
            debugCoinsEl.textContent = AppState.totalCoins;
            debugRecordingEl.textContent = AppState.isRecording ? '是' : '否';
        }

        // ====================================
        // 全螢幕功能
        // ====================================
        function setupFullscreen() {
            const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
            const enterFullscreenBtn = document.getElementById('enterFullscreenBtn');
            const fullscreenPrompt = document.getElementById('fullscreenPrompt');
            const container = document.querySelector('.container');
            
            // 進入全螢幕的函數
            async function enterFullscreen() {
                try {
                    if (container.requestFullscreen) {
                        await container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        await container.webkitRequestFullscreen();
                    } else if (container.mozRequestFullScreen) {
                        await container.mozRequestFullScreen();
                    } else if (container.msRequestFullscreen) {
                        await container.msRequestFullscreen();
                    }
                    console.log('✅ 已進入全螢幕模式');
                    // 隱藏提示
                    fullscreenPrompt.classList.add('hidden');
                } catch (error) {
                    console.error('❌ 無法進入全螢幕:', error);
                    alert('無法進入全螢幕模式，請檢查瀏覽器權限設定');
                }
            }
            
            // 退出全螢幕的函數
            async function exitFullscreen() {
                try {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        await document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        await document.msExitFullscreen();
                    }
                    console.log('✅ 已退出全螢幕模式');
                } catch (error) {
                    console.error('❌ 無法退出全螢幕:', error);
                }
            }
            
            // 檢查是否在全螢幕模式
            function isFullscreen() {
                return !!(document.fullscreenElement || 
                         document.webkitFullscreenElement || 
                         document.mozFullScreenElement || 
                         document.msFullscreenElement);
            }
            
            // 點擊進入全螢幕按鈕
            enterFullscreenBtn.addEventListener('click', enterFullscreen);
            
            // 點擊退出按鈕
            exitFullscreenBtn.addEventListener('click', exitFullscreen);
            
            // 監聽全螢幕狀態變化
            function updateFullscreenState() {
                const isFull = isFullscreen();
                if (isFull) {
                    // 進入全螢幕時隱藏提示
                    fullscreenPrompt.classList.add('hidden');
                } else {
                    // 退出全螢幕時顯示提示（可選）
                    // fullscreenPrompt.classList.remove('hidden');
                }
                console.log('全螢幕狀態:', isFull ? '開啟' : '關閉');
            }
            
            document.addEventListener('fullscreenchange', updateFullscreenState);
            document.addEventListener('webkitfullscreenchange', updateFullscreenState);
            document.addEventListener('mozfullscreenchange', updateFullscreenState);
            document.addEventListener('MSFullscreenChange', updateFullscreenState);
            
            // ESC 鍵退出全螢幕（瀏覽器預設行為）
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isFullscreen()) {
                    exitFullscreen();
                }
                // F11 鍵切換全螢幕
                if (e.key === 'F11') {
                    e.preventDefault();
                    if (isFullscreen()) {
                        exitFullscreen();
                    } else {
                        enterFullscreen();
                    }
                }
            });
            
            // 檢查是否已經在全螢幕模式（例如從其他方式進入）
            if (isFullscreen()) {
                fullscreenPrompt.classList.add('hidden');
            }
            
            // 暴露給 Console 使用
            window.enterFullscreen = enterFullscreen;
            window.exitFullscreen = exitFullscreen;
            window.isFullscreen = isFullscreen;
        }

            };

            window.addCoins = function(count = 150, durationMs = 6000) {
                AppState.totalCoins += count;
                saveCoinsToStorage();
                spawnCoinsStaggered(count, durationMs);
                updateDebugInfo();
                console.log(`💰 增加 ${count} 枚金幣（分散 ${durationMs}ms）！總計: ${AppState.totalCoins}`);
                
                setTimeout(() => {
                    if (isScreenFilled()) {
                        console.log('🎉 畫面已填滿，準備列印');
                    }
                }, durationMs + 1500);
            };

            window.showPrint = function() {
                triggerPrintNotification();
            };

            window.hidePrint = function() {
                hidePrintNotification();
            };

            window.resetCoins = function() {
                AppState.totalCoins = 0;
                saveCoinsToStorage();
                coins = [];
                updateDebugInfo();
                console.log('🔄 金幣數已重置');
            };

            window.getState = function() {
                console.log('📊 當前狀態:', {
                    state: AppState.currentState,
                    totalCoins: AppState.totalCoins,
                    threshold: AppState.coinThreshold,
                    isRecording: AppState.isRecording,
                    guideText: AppState.currentGuideText
                });
                return AppState;
            };

            window.setThreshold = function(n) {
                AppState.coinThreshold = n;
                document.getElementById('debugTarget').textContent = n;
                console.log(`🎯 列印門檻設定為: ${n}`);
            };

            // ===== 引導語排程 =====
            window.setGuide = function(h = 22, m = 0) {
                AppState.guideHour = Math.max(0, Math.min(23, parseInt(h, 10)));
                AppState.guideMinute = Math.max(0, Math.min(59, parseInt(m, 10)));
                saveGuideScheduleToStorage();
                console.log(`🕙 引導語時間設定為：${AppState.guideHour.toString().padStart(2,'0')}:${AppState.guideMinute.toString().padStart(2,'0')}`);
            };

            window.enableGuide = function(enabled = true) {
                AppState.guideEnabled = !!enabled;
                saveGuideScheduleToStorage();
                console.log(`🧭 引導語排程：${AppState.guideEnabled ? '啟用' : '關閉'}`);
            };

            window.checkGuideNow = function() {
                maybeShowScheduledGuide();
            };

            window.resetGuideToday = function() {
                AppState.lastGuideShownDate = null;
                saveGuideScheduleToStorage();
                console.log('🔄 已清除今日引導語顯示記錄');
            };

            // 全螢幕相關指令
            window.enterFullscreen = function() {
                const container = document.querySelector('.container');
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.mozRequestFullScreen) {
                    container.mozRequestFullScreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            };

            window.exitFullscreen = function() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            };
        }

        // 清理函數
        function cleanup() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }

        window.addEventListener('beforeunload', cleanup);
    </script>
