<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素硬幣測試</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            color: #FFD700;
        }

        .info {
            text-align: center;
            margin-bottom: 30px;
        }

        .test-coin {
            width: 64px;
            height: 64px;
            margin: 20px;
            display: inline-block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background: 
                /* 第1行 (頂部) */
                linear-gradient(to right, 
                    transparent 0, transparent 24px,
                    #000 24px, #000 40px,
                    transparent 40px
                ) 0 0 / 64px 8px no-repeat,
                
                /* 第2行 */
                linear-gradient(to right,
                    transparent 0, transparent 16px,
                    #000 16px, #000 24px,
                    #FFD700 24px, #FFD700 40px,
                    #000 40px, #000 48px,
                    transparent 48px
                ) 0 8px / 64px 8px no-repeat,
                
                /* 第3行 */
                linear-gradient(to right,
                    transparent 0, transparent 8px,
                    #000 8px, #000 16px,
                    #FFD700 16px, #FFD700 48px,
                    #000 48px, #000 56px,
                    transparent 56px
                ) 0 16px / 64px 8px no-repeat,
                
                /* 第4行 (中央) */
                linear-gradient(to right,
                    transparent 0, transparent 8px,
                    #000 8px, #000 16px,
                    #FFD700 16px, #FFD700 48px,
                    #000 48px, #000 56px,
                    transparent 56px
                ) 0 24px / 64px 8px no-repeat,
                
                /* 第5行 (中央) */
                linear-gradient(to right,
                    transparent 0, transparent 8px,
                    #000 8px, #000 16px,
                    #FFD700 16px, #FFD700 48px,
                    #000 48px, #000 56px,
                    transparent 56px
                ) 0 32px / 64px 8px no-repeat,
                
                /* 第6行 */
                linear-gradient(to right,
                    transparent 0, transparent 8px,
                    #000 8px, #000 16px,
                    #FFD700 16px, #FFD700 48px,
                    #000 48px, #000 56px,
                    transparent 56px
                ) 0 40px / 64px 8px no-repeat,
                
                /* 第7行 */
                linear-gradient(to right,
                    transparent 0, transparent 16px,
                    #000 16px, #000 24px,
                    #FFD700 24px, #FFD700 40px,
                    #000 40px, #000 48px,
                    transparent 48px
                ) 0 48px / 64px 8px no-repeat,
                
                /* 第8行 (底部) */
                linear-gradient(to right,
                    transparent 0, transparent 24px,
                    #000 24px, #000 40px,
                    transparent 40px
                ) 0 56px / 64px 8px no-repeat;
        }

        .grid {
            display: inline-block;
            margin: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #FFD700;
        }

        h1, h2 {
            color: #FFD700;
            text-align: center;
        }

        .description {
            text-align: center;
            margin: 20px;
            line-height: 1.6;
        }

        .button {
            display: block;
            margin: 30px auto;
            padding: 15px 30px;
            background: #000;
            border: 4px solid #FFD700;
            color: #FFD700;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 8px 8px 0 #FFD700;
            font-family: 'Courier New', monospace;
        }

        .button:hover {
            background: #FFD700;
            color: #000;
        }

        .button:active {
            box-shadow: 4px 4px 0 #FFD700;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>🎮 像素風硬幣設計測試</h1>
        <p class="description">
            純粹的像素色塊設計 - 只用黑色和金色<br>
            64x64px，8x8 色塊網格
        </p>
    </div>

    <div style="text-align: center;">
        <div class="grid">
            <h2>硬幣預覽</h2>
            <div class="test-coin"></div>
            <div class="test-coin"></div>
            <div class="test-coin"></div>
        </div>

        <div class="grid">
            <h2>像素圖解</h2>
            <pre style="color: #FFD700; font-size: 12px; line-height: 1.2;">
      ██
    ██▓▓██
  ██▓▓▓▓▓▓██
  ██▓▓▓▓▓▓██
  ██▓▓▓▓▓▓██
  ██▓▓▓▓▓▓██
    ██▓▓██
      ██

■ = 黑色邊框
▓ = 金色內部
            </pre>
        </div>
    </div>

    <button class="button" onclick="location.href='diary-reward.html'">
        🚀 開啟完整應用
    </button>

    <div class="description">
        <h2>特點說明</h2>
        <p>
            ✅ 8行 × 8列 色塊組成<br>
            ✅ 只用黑色和金色<br>
            ✅ 無漸層、無特效、無圖案<br>
            ✅ 純粹的像素風格<br>
            ✅ 64x64px 尺寸<br>
        </p>
    </div>
</body>
</html>
