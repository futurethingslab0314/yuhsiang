<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素日記獎勵系統</title>
    
    <!-- Google Fonts - 像素風格字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Noto Sans TC', monospace;
            background: #000;
            color: #FFD700;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* 主遊戲容器 */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* 像素硬幣畫布 */
        #pixelCoinCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* 語音指示器 */
        #voiceIndicatorContainer {
            position: absolute;
            top: 120px;
            right: 120px;
            z-index: 10;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .voice-indicator-dot {
            width: 28px;
            height: 28px;
            background-color: white;
            display: inline-block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: transform 0.1s ease-in-out;
        }

        /* 資訊面板 */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 3px solid #FFD700;
            font-size: 12px;
            z-index: 20;
            box-shadow: 4px 4px 0 #FFD700;
        }

        .info-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            min-width: 200px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #FFD700;
            font-weight: bold;
        }

        /* 設定按鈕 */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: #000;
            border: 3px solid #FFD700;
            color: #FFD700;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0 #FFD700;
            transition: none;
            image-rendering: pixelated;
        }

        .settings-btn:hover {
            background: #FFD700;
            color: #000;
        }

        .settings-btn:active {
            box-shadow: 2px 2px 0 #FFD700;
            transform: translate(2px, 2px);
        }

        /* 設定面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-left: 3px solid #FFD700;
            z-index: 100;
            transition: right 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #FFD700;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 2px solid #FFD700;
            background: rgba(255, 215, 0, 0.1);
        }

        .settings-title {
            font-size: 16px;
            font-weight: bold;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background: #FFD700;
            color: #000;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000;
        }

        .close-btn:hover {
            background: #000;
            color: #FFD700;
            border: 2px solid #FFD700;
        }

        .settings-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .settings-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .section-title {
            font-size: 12px;
            color: #FFD700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 日期顯示 */
        .date-display {
            text-align: center;
            padding: 10px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            margin-bottom: 20px;
            font-size: 10px;
        }

        /* 輸入模式切換 */
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            background: #000;
            border: 2px solid #FFD700;
            color: #FFD700;
            cursor: pointer;
            font-size: 10px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #FFD700;
            color: #000;
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 215, 0, 0.2);
        }

        /* 文字輸入區 */
        .text-input-area {
            margin-bottom: 20px;
        }

        .diary-textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            background: #000;
            border: 2px solid #FFD700;
            color: #FFD700;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        .diary-textarea:focus {
            outline: none;
            border-color: #FFA500;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .char-counter {
            text-align: right;
            font-size: 10px;
            color: #888;
            margin-top: 5px;
        }

        /* 語音輸入區 */
        .voice-input-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .voice-input-area.active {
            display: flex;
        }

        .voice-record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #FFD700;
            background: #000;
            color: #FFD700;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .voice-record-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .voice-record-btn.recording {
            background: #FF0000;
            border-color: #FF0000;
            animation: pulse-record 1.5s infinite;
        }

        @keyframes pulse-record {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .voice-text {
            font-size: 8px;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            color: #FF0000;
            font-size: 10px;
        }

        .recording-indicator.active {
            display: flex;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .voice-transcript {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            background: #000;
            border: 1px solid #FFD700;
            color: #FFD700;
            font-size: 12px;
            line-height: 1.4;
        }

        /* 提交按鈕 */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #FFD700;
            color: #000;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 3px 3px 0 #000;
        }

        .submit-btn:hover {
            background: #FFA500;
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #000;
        }

        .submit-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 #000;
        }

        .submit-btn:disabled {
            background: #666;
            color: #333;
            cursor: not-allowed;
            transform: none;
            box-shadow: 3px 3px 0 #333;
        }

        /* 分析狀態 */
        .analysis-status {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            margin-top: 20px;
        }

        .analysis-status.active {
            display: flex;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 進度追蹤 */
        .progress-section {
            margin-top: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #FFD700;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            color: #000;
            font-size: 8px;
            font-weight: bold;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 10px;
        }

        /* 今日獲得提示 */
        .today-gain-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            color: #FFD700;
            padding: 20px 40px;
            border: 4px solid #FFD700;
            font-size: 24px;
            font-weight: bold;
            z-index: 200;
            box-shadow: 8px 8px 0 #FFD700;
            animation: toast-appear 3s ease-in-out;
            display: none;
        }

        .today-gain-toast.show {
            display: block;
        }

        @keyframes toast-appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            10% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            15%, 85% {
                transform: translate(-50%, -50%) scale(1);
            }
            95% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        /* 列印卡片 */
        .print-card {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #000;
            text-align: center;
        }

        .print-card.show {
            display: block;
        }

        .print-title {
            font-size: 14px;
            color: #000;
            margin-bottom: 10px;
        }

        .print-btn {
            padding: 10px 20px;
            background: #000;
            color: #FFD700;
            border: none;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 2px 2px 0 #FFD700;
        }

        .print-btn:hover {
            background: #333;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .settings-panel {
                width: 100%;
                right: -100%;
            }
            
            .info-panel {
                top: 10px;
                left: 10px;
                padding: 10px;
                font-size: 10px;
            }
            
            .info-item {
                min-width: 150px;
            }
            
            .settings-btn {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            #voiceIndicatorContainer {
                top: 60px;
                right: 60px;
            }
            
            .voice-indicator-dot {
                width: 20px;
                height: 20px;
            }
        }

        /* 隱藏類別 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 像素硬幣畫布 -->
        <canvas id="pixelCoinCanvas"></canvas>
        
        <!-- 語音指示器 -->
        <div id="voiceIndicatorContainer"></div>
        
        <!-- 資訊面板 -->
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">硬幣數量:</span>
                <span class="info-value" id="coinCount">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">目標:</span>
                <span class="info-value" id="targetCoins">100</span>
            </div>
            <div class="info-item">
                <span class="info-label">今日獲得:</span>
                <span class="info-value" id="todayGain">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">狀態:</span>
                <span class="info-value" id="gameStatus">等待中</span>
            </div>
        </div>
        
        <!-- 設定按鈕 -->
        <button class="settings-btn" id="settingsBtn">⚙️</button>
        
        <!-- 設定面板 -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2 class="settings-title">像素日記獎勵</h2>
                <button class="close-btn" id="closeBtn">✕</button>
            </div>
            
            <div class="settings-content">
                <!-- 日期顯示 -->
                <div class="settings-section">
                    <div class="date-display" id="dateDisplay"></div>
                </div>

                <!-- 輸入模式切換 -->
                <div class="settings-section">
                    <div class="section-title">輸入模式</div>
                    <div class="mode-toggle">
                        <button class="mode-btn active" data-mode="text">📝 文字</button>
                        <button class="mode-btn" data-mode="voice">🎤 語音</button>
                    </div>
                </div>

                <!-- 文字輸入區 -->
                <div class="settings-section text-input-area">
                    <div class="section-title">今日日記</div>
                    <textarea 
                        id="diaryInput" 
                        class="diary-textarea" 
                        placeholder="寫下你今天的心情..."
                        maxlength="500"></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span> / 500
                    </div>
                </div>

                <!-- 語音輸入區 -->
                <div class="settings-section voice-input-area" id="voiceInputArea">
                    <div class="section-title">語音錄製</div>
                    <button class="voice-record-btn" id="voiceRecordBtn">
                        <span class="voice-icon">🎤</span>
                        <span class="voice-text">開始錄音</span>
                    </button>
                    <div class="recording-indicator" id="recordingIndicator">
                        <span class="pulse-dot"></span>
                        <span>錄音中...</span>
                    </div>
                    <div class="voice-transcript" id="voiceTranscript"></div>
                </div>

                <!-- 提交按鈕 -->
                <div class="settings-section">
                    <button class="submit-btn" id="submitBtn">
                        ✨ 提交日記獲得硬幣
                    </button>
                </div>

                <!-- 分析狀態 -->
                <div class="analysis-status" id="analysisStatus">
                    <div class="loading-spinner"></div>
                    <p>AI 正在分析你的日記...</p>
                </div>

                <!-- 進度追蹤 -->
                <div class="settings-section progress-section">
                    <div class="section-title">進度追蹤</div>
                    <div class="progress-text">
                        <span id="currentProgress">0</span> / <span id="targetProgress">100</span>
                        <span>目標達成</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <!-- 列印卡片 -->
                <div class="print-card" id="printCard">
                    <div class="print-title">🎟️ 恭喜達成目標！</div>
                    <p style="font-size: 10px; margin: 10px 0;">你可以列印專屬任務紙籤</p>
                    <button class="print-btn" id="printBtn">列印紙籤</button>
                </div>
            </div>
        </div>

        <!-- 今日獲得提示 -->
        <div class="today-gain-toast" id="todayGainToast">
            今日 +<span id="toastAmount">0</span> 硬幣！
        </div>
    </div>

    <script src="pixel-diary-system.js"></script>
</body>
</html>
